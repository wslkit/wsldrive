name: Release

# Build the binaries + GUI installer and attach them to a GitHub Release.
# Triggered by pushing a version tag (v1.2.3). Can also be run manually
# (workflow_dispatch) to build the artifacts without publishing a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a manual build (e.g. 0.2.0-test); no release is published'
        required: false
        default: '0.0.0-dev'

permissions:
  contents: write

jobs:
  # -- Linux client (Direction B), built on a Linux runner and handed to the
  #    Windows job so the installer can embed it. --------------------------
  # Built on the OLDEST supported Ubuntu so the binaries load on every distro the
  # README promises (22.04+ / Debian 12+): a build on 24.04 needs glibc 2.38,
  # which 22.04 does not have. libstdc++/libgcc are linked statically for the
  # same reason; glibc itself cannot be, so its ceiling is checked below.
  linux:
    name: Linux client
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 22.04's default GCC 11 has no <expected>; g++-12 is in its own repos and,
      # with libstdc++ linked statically, the binary still only needs 22.04's glibc.
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libfuse3-dev g++-12
      - name: Build
        run: |
          cmake --preset linux-release -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 \
                -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          # wsldrive = client (Direction B); wsldrived = agent (Direction A auto-launch)
          cmake --build --preset linux-release --target wsldrive wsldrived --parallel
      - name: Check the glibc ceiling (must run on Ubuntu 22.04 / Debian 12)
        run: |
          for b in wsldrive wsldrived; do
            f=build/linux-release/src/tools/$b
            max=$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -t. -k2,2n -k3,3n | tail -1)
            echo "$b: newest glibc symbol version $max"
            case "$max" in GLIBC_2.3[6-9]*|GLIBC_2.[4-9][0-9]*) echo "::error::$b needs $max; Ubuntu 22.04 has glibc 2.35"; exit 1;; esac
            if objdump -T "$f" | grep -q 'GLIBCXX_\|CXXABI_'; then echo "::error::$b links libstdc++ dynamically"; exit 1; fi
          done
      - name: Upload Linux binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wsldrive-linux
          path: |
            build/linux-release/src/tools/wsldrive
            build/linux-release/src/tools/wsldrived
          if-no-files-found: error

  # -- Windows binaries + installer, then publish the release. -------------
  windows:
    name: Windows binaries + installer
    runs-on: windows-latest
    needs: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.event.inputs.version }}'
          if (-not $v) { $v = ('${{ github.ref_name }}' -replace '^v','') }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version = $v"

      - name: Install WinFsp (SDK) and Inno Setup
        shell: pwsh
        run: |
          # Pinned and retried; see scripts/ci/choco-install.ps1. Both end up
          # inside the release artifacts - wsldrive.exe links the WinFsp SDK and
          # the Inno Setup compiler produces wsldrive-setup.exe - so neither is
          # something to pull at whatever version happens to be current.
          pwsh -NoProfile -File scripts/ci/choco-install.ps1 -Package winfsp
          pwsh -NoProfile -File scripts/ci/choco-install.ps1 -Package innosetup
          $inc = 'C:\Program Files (x86)\WinFsp\inc\fuse3\fuse.h'
          $lib = 'C:\Program Files (x86)\WinFsp\lib\winfsp-x64.lib'
          if (-not (Test-Path $inc) -or -not (Test-Path $lib)) {
            throw "WinFsp SDK (inc/lib) not found after install — the built wsldrive.exe would lack mount support. Adjust the WinFsp install step."
          }

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Build binaries
        shell: pwsh
        run: |
          cmake --preset msvc-release
          cmake --build --preset msvc-release --target wsldrive wsldrived wsldrivew --parallel

      - name: Verify mount support was compiled in
        shell: pwsh
        run: |
          $u = & '.\build\msvc-release\src\tools\wsldrive.exe' 2>&1 | Out-String   # usage exits non-zero
          if ($u -notmatch 'mount') { throw "wsldrive.exe has no 'mount' command — WinFsp was not linked." }
          Write-Host "mount support present."
          exit 0   # ignore wsldrive.exe's usage exit code

      - name: Fetch Linux binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wsldrive-linux
          path: build/linux-release/src/tools

      - name: Verify Linux binaries present
        shell: pwsh
        run: |
          foreach ($f in 'wsldrive','wsldrived') {
            if (-not (Test-Path "build/linux-release/src/tools/$f")) {
              throw "Linux $f missing after download — the installer would omit a direction."
            }
          }
          Write-Host "Linux client + agent present."

      - name: Build installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item installer\dist\wsldrive-setup.exe staging\
          # Zip for the script route: binaries at the root, scripts under scripts\
          # (the layout install.ps1 and the README expect). package-zip.ps1 is the
          # single definition of that layout; CI's installer job tests the same zip.
          .\scripts\package-zip.ps1 -WinBin build\msvc-release\src\tools -LinuxBin build\linux-release\src\tools -Out staging\wsldrive-windows-x64.zip
          Copy-Item build\linux-release\src\tools\wsldrive  staging\wsldrive-linux-x64
          Copy-Item build\linux-release\src\tools\wsldrived staging\wsldrived-linux-x64
          # Publish checksums so a download can be verified (the binaries are unsigned).
          Get-ChildItem staging -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content staging\SHA256SUMS.txt -Encoding ascii
          Get-Content staging\SHA256SUMS.txt

      - name: Upload build artifacts (always, for inspection)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wsldrive-release-assets
          path: staging/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: staging/*
          generate_release_notes: true
          fail_on_unmatched_files: true
