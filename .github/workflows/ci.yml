name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Configure
        run: cmake --preset msvc-release
      - name: Build
        run: cmake --build --preset msvc-release --parallel
      - name: Test
        run: ctest --preset msvc-release

  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libfuse3-dev
      - name: Configure
        run: cmake --preset linux-release
      - name: Build
        run: cmake --build --preset linux-release --parallel
      - name: Test
        run: ctest --preset linux-release

  # Mounts a real filesystem and exercises the operations tools depend on. Unit
  # tests cannot catch a missing FUSE callback — `chmod` was unimplemented, which
  # made git abort every clone on a mount while the whole suite stayed green.
  conformance:
    name: Filesystem conformance (mounted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libfuse3-dev fuse3 inotify-tools
      - name: Build
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release --target wsldrive wsldrived --parallel
      - name: Run the conformance battery
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          bash scripts/fs-conformance.sh
      # The other half of "the mount behaves like a filesystem": a change made on
      # the far side has to raise a real inotify event here, or every watch-mode
      # tool silently does nothing. Which kernel hook each operation runs is not
      # observable from a unit test, so it can only be checked on a live mount.
      - name: Run the change-notification battery
        run: bash scripts/inotify-conformance.sh

  # The same idea for Direction A - the feature the product is named for. Mounts
  # a real drive letter through WinFsp on the Windows runner and runs the Windows
  # battery twice: write-through, and the write-back buffering path.
  conformance-windows:
    name: Filesystem conformance (WinFsp mount)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install WinFsp (runtime + SDK)
        shell: pwsh
        run: |
          # Pinned and retried; see scripts/ci/choco-install.ps1.
          pwsh -NoProfile -File scripts/ci/choco-install.ps1 -Package winfsp
          if (-not (Test-Path 'C:\Program Files (x86)\WinFsp\lib\winfsp-x64.lib')) { throw 'WinFsp SDK not found after install' }
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Build
        shell: pwsh
        run: |
          cmake --preset msvc-release
          cmake --build --preset msvc-release --target wsldrive wsldrived --parallel
          $u = & '.\build\msvc-release\src\tools\wsldrive.exe' 2>&1 | Out-String
          if ($u -notmatch 'mount') { throw "wsldrive.exe has no 'mount' command - WinFsp was not linked." }
          exit 0
      - name: Conformance (write-through)
        shell: pwsh
        run: .\scripts\fs-conformance.ps1
      - name: Conformance (write-back)
        shell: pwsh
        run: .\scripts\fs-conformance.ps1 -Writeback -Port 51997

  # The installer is how everyone gets the product, and nothing else runs it:
  # a completely broken -Uninstall shipped unnoticed because the file parsed
  # fine and the bug only existed at runtime. -DryRun changes nothing, so every
  # code path can run here against a release-zip layout, without elevation or
  # WSL. The Inno Setup script is compiled too. Placeholder binaries are enough:
  # a dry run only checks that they exist, and ISCC only packs bytes (the real
  # binaries are compiled in by release.yml).
  installer:
    name: Installer (dry-run + compile)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem scripts -Filter *.ps1 -Recurse) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $bad++; Write-Host "::error file=$($f.FullName)::$($errors[0].Message)" } else { Write-Host "ok  $($f.Name)" }
          }
          if ($bad) { throw "$bad script(s) do not parse" }
      - name: Build the release zip exactly as release.yml does, then unpack it
        shell: pwsh
        run: |
          # Placeholder binaries: the zip layout is what is under test here, and a
          # dry run only checks that the files exist.
          New-Item -ItemType Directory -Force -Path bin\win, bin\linux | Out-Null
          foreach ($f in 'wsldrive.exe','wsldrived.exe','wsldrivew.exe') { Set-Content -Path "bin\win\$f" -Value 'placeholder' }
          foreach ($f in 'wsldrive','wsldrived') { Set-Content -Path "bin\linux\$f" -Value 'placeholder' }
          .\scripts\package-zip.ps1 -WinBin bin\win -LinuxBin bin\linux -Out wsldrive-windows-x64.zip
          Expand-Archive wsldrive-windows-x64.zip -DestinationPath rel
          # The README's route 2 command must resolve inside the unpacked zip.
          if (-not (Test-Path rel\scripts\install.ps1)) { throw 'zip lacks scripts\install.ps1 - README route 2 would fail' }
          Get-ChildItem rel -Recurse -Name
      - name: Dry run - Direction A (easy mode)
        shell: pwsh
        run: |
          $out = & pwsh -NoProfile -File rel\scripts\install.ps1 -DryRun -Unattended -DriveLetter W -Distro Ubuntu -WslRoot '~' 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "exit $LASTEXITCODE" }
          if ($out -notmatch "would register logon task 'wsldrive-mount-W'") { throw 'the plan does not register the W: task' }
          if ($out -notmatch 'would start wsldrive-mount-W') { throw 'the plan does not start the mount' }
          if ($out -match 'needs the Linux build') { throw 'the Linux agent in the zip was not found from the unpacked layout' }
      - name: Dry run - several mounts from the example config
        shell: pwsh
        run: |
          $out = & pwsh -NoProfile -File rel\scripts\install.ps1 -DryRun -Unattended -Config rel\wsldrive.example.json 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "exit $LASTEXITCODE" }
          foreach ($t in "wsldrive-mount-W", "wsldrive-mount-Y", "wsldrive-mount-ubuntu-win") {
            if ($out -notmatch [regex]::Escape("would register logon task '$t'")) { throw "the plan lacks task $t" }
          }
          if ($out -notmatch 'would register service GUIDs') { throw 'Direction B over hvsocket must register the service GUIDs' }
      - name: Dry run - a colliding config is rejected
        shell: pwsh
        run: |
          '{ "mounts": [ { "drive": "W", "distro": "Ubuntu" }, { "drive": "W", "distro": "Debian" } ] }' | Set-Content rel\collide.json
          $out = & pwsh -NoProfile -File rel\scripts\install.ps1 -DryRun -Unattended -Config rel\collide.json 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -eq 0) { throw 'two mounts on one drive letter must be rejected' }
          if ($out -notmatch 'same drive letter') { throw 'the rejection must say why' }
          exit 0   # the rejection IS the pass; the step shell would otherwise re-raise the child's exit code
      - name: Dry run - uninstall
        shell: pwsh
        run: |
          $out = & pwsh -NoProfile -File rel\scripts\install.ps1 -Uninstall -DryRun 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "exit $LASTEXITCODE" }
          if ($out -notmatch 'would unregister hvsocket service GUIDs') { throw 'uninstall plan is incomplete' }
          if ($out -notmatch 'Uninstalled') { throw 'uninstall did not run to the end' }
      - name: Compile the GUI installer (Inno Setup)
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/ci/choco-install.ps1 -Package innosetup
          # build-installer.ps1 expects the source-tree layout; placeholders again.
          New-Item -ItemType Directory -Force -Path build\msvc-release\src\tools, build\linux-release\src\tools | Out-Null
          foreach ($f in 'wsldrive.exe','wsldrived.exe','wsldrivew.exe') { Set-Content -Path "build\msvc-release\src\tools\$f" -Value 'placeholder' }
          foreach ($f in 'wsldrive','wsldrived') { Set-Content -Path "build\linux-release\src\tools\$f" -Value 'placeholder' }
          .\scripts\build-installer.ps1 -Version 0.0.0-ci
          if (-not (Test-Path installer\dist\wsldrive-setup.exe)) { throw 'ISCC produced no installer' }

  benchmarks:
    name: Benchmarks (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libfuse3-dev
      - name: Configure
        run: cmake --preset linux-release
      - name: Build benchmarks
        run: cmake --build --preset linux-release --target core_bench --parallel
      # A tiny min-time keeps this fast; it verifies the benchmarks run, not their
      # numbers (shared runners are too noisy to gate on timings).
      - name: Run benchmarks
        run: ./build/linux-release/bench/core_bench --benchmark_min_time=0.01s
